  Generated Dart and Flutter client for the FauxShield anti-counterfeit
  platform. Typed models and endpoint classes for products, serialized units,
  verifications, and fraud alerts.

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  serverpod_auth_idp_client: 4.0.4
  serverpod_client: 4.0.4
  serverpod_database: ^4.0.4
  serverpod_offline_sync_client: ^0.0.9
