name: fauxshield_mcp
description: >-
  Model Context Protocol server for the FauxShield anti-counterfeit platform.
  Gives AI agents scoped, auditable access to products, batches, serialized
  units, fraud alerts, recalls, and the audit trail.
version: 1.0.0
repository: https://github.com/tope-olajide/fauxshield

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  # The published Dart client; inside the workspace pub resolves it to the
  # local member the generator rewrites, so development always uses the
  # generated protocol.
  fauxshield_client: ^1.0.0
  mcp_dart: ^2.4.2

executables:
  fauxshield-mcp: fauxshield_mcp

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
