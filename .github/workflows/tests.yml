name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.4'
      SERVERPOD_PASSWORD_database: '0y7X8J61axLuGrsazeLRGE7t3oezbtR9'
      SERVERPOD_PASSWORD_redis: 'fuFxqG0dAsXwblHWWBHfRacoIUMSZiS7'

    steps:
      - uses: actions/checkout@v4

      # Keep this on the same stable channel the project is developed against,
      # so CI resolves the same SDK and dependency graph as a local build.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{runner.os}}-${{env.VERSION}}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: fauxshield_server
        run: serverpod generate

      - name: Run server tests
        working-directory: fauxshield_server
        run: dart test

      # The server's suite covers the API; these two clients are what
      # operators and agents actually drive it with, so they are analyzed and
      # tested on their own terms. Generated code is left out of the check.
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            fauxshield_cli/lib fauxshield_cli/bin fauxshield_cli/test \
            fauxshield_mcp/lib fauxshield_mcp/bin fauxshield_mcp/test \
            fauxshield_contract/lib fauxshield_contract/bin \
            fauxshield_contract/test

      - name: Analyze and test the CLI
        working-directory: fauxshield_cli
        run: |
          dart analyze
          dart test

      - name: Analyze and test the MCP server
        working-directory: fauxshield_mcp
        run: |
          dart analyze
          dart test

      # The contract is read from the same generated client the server just
      # regenerated, so a client change that leaves it behind fails here instead
      # of drifting into the Node.js and Python SDKs.
      - name: Check the API contract against the generated client
        working-directory: fauxshield_contract
        run: |
          dart analyze
          dart test
          dart run bin/extract.dart --check

      # The reference pages, the SDK pages, and the parity matrix are generated
      # from that contract. If they are stale, the portal would describe an API
      # that no longer exists — so this is a build failure, not a warning.
      - name: Check the generated documentation reference
        working-directory: fauxshield_server
        run: dart run tool/generate_docs.dart --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The SDK is generated from the contract that was just checked, built with
      # tsc, and tested against a fake transport, so nothing here needs the API.
      - name: Build and test the Node.js SDK
        working-directory: fauxshield_node
        run: |
          npm install --no-audit --no-fund
          npm run generate
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same contract, same seam: the Python SDK is generated, then tested with
      # an injected transport, so the suite needs no network either.
      - name: Test the Python SDK
        working-directory: fauxshield_python
        env:
          PYTHONPATH: src
        run: |
          python tools/generate.py
          python -m unittest discover -s tests -v

      # A wheel that does not install is not an SDK, so the package is built
      # and imported from the installed copy, not from the working tree.
      - name: Build and install the Python SDK wheel
        run: |
          python -m pip wheel ./fauxshield_python --no-deps -w /tmp/wheel
          python -m pip install --no-deps --target /tmp/installed /tmp/wheel/fauxshield_sdk-*.whl
          PYTHONPATH=/tmp/installed python -c \
            "import fauxshield; assert fauxshield.DEFAULT_BASE_URL == 'https://fauxshield.api.serverpod.space', fauxshield.DEFAULT_BASE_URL"

      # The one check that spans all of it: every SDK against the contract,
      # every published client against the hosted API URL rather than localhost,
      # and the CLI and MCP surfaces against the pages that document them.
      - name: Check cross-language parity and documentation coverage
        run: python tools/check_parity.py
