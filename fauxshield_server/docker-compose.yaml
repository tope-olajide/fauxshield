services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fauxshield
      POSTGRES_PASSWORD: "RaM81RG-oqWMWGBtI08AcJ25pS0pOUD6"
    volumes:
      - fauxshield_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "8vrEPR8TY_KiRkdeQabq9RG9btFC1OC-"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fauxshield_test
      POSTGRES_PASSWORD: "0y7X8J61axLuGrsazeLRGE7t3oezbtR9"
    volumes:
      - fauxshield_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "fuFxqG0dAsXwblHWWBHfRacoIUMSZiS7"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  fauxshield_data:
  fauxshield_test_data:
