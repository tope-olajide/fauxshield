# HACKATHON NOTE: this file is intentionally committed with development-only
# values so a fresh clone runs without setup. Every value here is disposable.
# For any real deployment, generate new secrets and store them with
# `serverpod cloud password set <key>` (see docs/DEPLOYMENT.md).
#
# Use this file to store passwords to services that your server you use. When
# the server starts, the passwords will be automatically loaded and can be
# accessed from the `session.passwords` field. If you don't have access to a
# session object, passwords can also be accessed from
# `Serverpod.instance.passwords`. You can provide different passwords for
# different run configurations. If you want the same password for any
# configuration used, place it under `shared`.
#
# Note that this file should not be under version control. Store it in a safe
# place.

# Save passwords used across all configurations here.
shared:
  # HMAC-SHA256 key that binds every QR token to its workspace, product, and
  # identity. Rotating it invalidates existing token signatures.
  hmacSecretKey: '4327fe3ab1ba6285a69bd49e21b3e7c15268cc19628e37e58df9a91d657b4024'
  # AES-256-GCM key that encrypts packaging PINs for authorized, audited
  # retrieval. 32 bytes as hex.
  pinEncryptionKey: '3010b51a6e96f0c0a68fc8688e26c3978004cedd178ea9bafbd0221d3c10162f'
  # AES-256-GCM key that encrypts webhook signing secrets at rest. 32 bytes as hex.
  webhookEncryptionKey: '0210aaebccc07db4368e0aa3d04f9f4e628163de302b4411d52483b1ed66db5c'
  # Secret that gates the demo data endpoint. Change it in a real deployment.
  demoSeedSecret: '25b842e44d1e33b18f01a97bf098a8cb'
  # Geo provider: demo, http, or disabled.
  #
  # `demo` is for local runs and demos only. It answers from a built-in city
  # list plus a hash of the address, so for any address its list does not cover
  # it *invents* a city (a Lagos scan was reported as Manila this way). The
  # verify page's device timezone outranks the invention, but a real deployment
  # should run `http` so the city is looked up rather than guessed — set it as a
  # managed secret, which takes precedence over this file:
  #   serverpod cloud password set geoProvider http
  # Use `disabled` to store no location at all.
  geoProvider: 'demo'
  # Template for an HTTP geo lookup, used when geoProvider is http. The resolved
  # IP is substituted for {ip}, and a failure leaves the location unknown rather
  # than falling back to the demo list. Store it the same way:
  #   serverpod cloud password set geoLookupUrlTemplate 'https://ipwho.is/{ip}'
  # geoLookupUrlTemplate: 'https://ipapi.co/{ip}/json/'

