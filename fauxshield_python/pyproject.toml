[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fauxshield-sdk"
version = "0.1.0"
description = "Python SDK for the FauxShield anti-counterfeit platform: products, serialized units, verifications, and the fraud queue."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["fauxshield", "anti-counterfeit", "provenance", "traceability", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
# The SDK talks to the API over the standard library, so installing it pulls in
# nothing else and works in a locked-down environment.
dependencies = []

[project.urls]
Homepage = "https://fauxshield.serverpod.space"
Documentation = "https://fauxshield.serverpod.space/docs"
Source = "https://github.com/tope-olajide/fauxshield"

[tool.setuptools.packages.find]
where = ["src"]
