name: fauxshield_cli
description: >-
  Command line client for the FauxShield anti-counterfeit platform. Drive the
  whole API from a terminal or a script: products, batches, serialized units,
  verifications, fraud alerts, recalls, webhooks, simulations, and the audit
  log.
version: 1.0.0
repository: https://github.com/tope-olajide/fauxshield

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  args: ^2.6.0
  # The published Dart client; inside the workspace pub resolves it to the
  # local member the generator rewrites, so development always uses the
  # generated protocol.
  fauxshield_client: ^1.0.0

executables:
  fauxshield: fauxshield

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
