name: fauxshield_cli
description: >-
  Command line client for the FauxShield anti-counterfeit platform. Manage
  products, batches, identities, and fraud alerts from a terminal.
version: 1.0.0
publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  args: ^2.6.0
  fauxshield_client:
    path: ../fauxshield_client

executables:
  fauxshield: fauxshield

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
